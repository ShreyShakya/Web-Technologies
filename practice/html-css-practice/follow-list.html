<!DOCTYPE html>
<html>

<head>
  <style>
    p {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }

    .box {
      width: 400px;
      border-color: lightgray;
      border-style: solid;
      border-radius: 6px;
      border-width: 2px;
    }

    .title {
      font-family: Arial, Helvetica, sans-serif;
      margin-top: 5px;
      margin-bottom: 3px;
      font-weight: 600;
    }

    .stitle {
      color: gray;
      font-size: 12px;
      margin-bottom: 2px;
    }

    button {
      border: none;
      border-radius: 4px;
      color: white;
      background-color: #1DA1F2;
      font-weight: 700;
      padding-top: 8px;
      padding-bottom: 8px;
      margin-right: 10px;

    }

    .container {
      display: grid;
      grid-template-columns: 50px 1fr 70px;
      align-items: center;
      padding: 10px;
    }

    .pp {
      border-radius: 50%;
      width: 50px;
      align-items: center;
      margin-left: 5px;
    }

    .info {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
    }
  </style>

</head>

<body>
  <div class="box">
      <div class="container">
        <img class="pp" src="channel-pictures/channel-8.jpeg"> 

        <div class="info">
          <p class="title">Oliver</p>
          <p class="stitle">Fat cat</p>
          <p class="stitle">Popular</p>
        </div>
        

        <button>Follow</button>
      </div>

      <div class="container">
        <img class="pp" src="channel-pictures/channel-2.jpeg"> 

        <div class="info">
          <p class="title">Oliver</p>
          <p class="stitle">Fat cat</p>
          <p class="stitle">Popular</p>
        </div>
        

        <button>Follow</button>
      </div>

      <div class="container">
        <img class="pp" src="channel-pictures/channel-1.jpeg"> 

        <div class="info">
          <p class="title">Oliver</p>
          <p class="stitle">Fat cat</p>
          <p class="stitle">Popular</p>
        </div>
        

        <button>Follow</button>
      </div>




</body>

</html>
