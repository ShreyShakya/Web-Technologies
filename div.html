<!DOCTYPE html>
<html>

<head>

  <style>
    .button {
      padding-left: 10px;
      padding-right: 10px;
      padding-top: 6px;
      padding-bottom: 6px;
      position: absolute;
      background-color: black;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      top: 6px;
      right: 0px;
    }

    .box {
      width: 320px;
      height: 180px;
      background-color: gray;
      position: relative;
      display: grid;
    }

    img {
      width: 100%;
      opacity: 0.7;
    }
  </style>
</head>

<body style="padding-bottom: 3000px; padding-top: 20px;">


  <div class="box">
    <div>
      <img src="thumbnails/thumbnail-4.webp">
      <div class="button">20% off</div>
    </div>
  </div>
  </div>

</body>

</html>
