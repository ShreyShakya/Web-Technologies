<!DOCTYPE html>
<html>

<head>
  <title>First Website</title>
</head>

<body>
  <a href="https://www.youtube.com/" target="_blank">Back to Amazon</a>

  <h1>Nike Black Running Shoes</h1>

  <h3 class="price">$39 - In Stock.</h3>

  <h3 class="delivery">Free delivery tomorrow.</h3>

  <button class="cart">Add to cart</button>
  <button class="buy">Buy now</button>

  <style>
    a {
      color: rgb(0, 113, 133);
    }

    .price {
      color: rgb(0, 118, 0);
    }

    .cart {
      height: 36px;
      width: 100px;
      border-radius: 18px;
      background-color: yellow;
      border: none;
      width: 125px;
      margin-right: 10px;

    }

    .buy {
      height: 36px;
      width: 100px;
      border-radius: 18px;
      background-color: orange;
      border: none;
      width: 125px;

    }
  </style>
</body>

</html>
